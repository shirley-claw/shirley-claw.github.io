<style>

/* ===== sheet base ===== */

  const weeksOf=m=>{const d=new Date(m);d.setDate(1-((m.getDay()-ws+7)%7));const rows=[];do{const r=[];for(let i=0;i<7;i++){r.push(new Date(d));d.setDate(d.getDate()+1)}rows.push(r)}while(d.getMonth()===m.getMonth());return rows};
  const we=d=>d.getDay()===0||d.getDay()===6, wk=r=>isoWeek(r[(11-ws)%7]);
  const hue=m=>(m.getMonth()*31+345)%360;
  const W=S.wbg?' wbg':'';
  $('orhint').textContent=F==='daily'&&S.orient==='landscape'?'Tear-off daily always prints portrait (4 cards per sheet).':'';
  const sheet=(cls,m,inner)=>`<div class="sheet ${T}${W} ${cls}" style="--h:${hue(m)};--phh:${S.phsize}%">${S.holes&&/flip|day/.test(cls)?'<div class="holes"><i></i><i></i></div>':''}<div class="in">${inner}</div></div>`;
  const hdr=(m,yr=true)=>`<div class="hdr"><span class="mnum">${String(m.getMonth()+1).padStart(2,'0')}</span><span class="mn">${esc(cap(mName.format(m)))}</span>${yr?`<span class="yr">${m.getFullYear()}</span>`:''}</div>`;
  const photo=(i,m,extra='')=>{const p=P[i];return `<div class="ph" data-slot="${i}">${p?`<img src="${p.url}" style="object-position:${p.x}% ${p.y}%" draggable="false">`:`<div class="phx"><em>${extra?'':String(m.getMonth()+1).padStart(2,'0')}</em><span>Click or drop a photo</span></div>`}${S.caps&&p?.cap?`<div class="cap">${esc(p.cap)}</div>`:''}${extra}</div>`};
  const grid=m=>{const rows=weeksOf(m);
    return `<div class="grid" style="--gc:${S.wknum?'5% ':''}repeat(7,1fr)">`+(S.wknum?'<div class="hd"></div>':'')+wdays.map(w=>`<div class="hd">${esc(dShort.format(w))}</div>`).join('')+
    rows.map(r=>(S.wknum?`<div class="wk">${wk(r)}</div>`:'')+r.map(d=>{const off=d.getMonth()!==m.getMonth();if(off&&!S.spill)return'<div class="d off"></div>';const e=off?[]:ev(d);
      return `<div class="d w${d.getDay()}${we(d)?' we':''}${off?' off':''}${e.length?' hol':''}"><b>${d.getDate()}</b>${e.map(x=>`<i>${esc(x)}</i>`).join('')}</div>`}).join('')).join('')+'</div>'};
  const mini=m=>{const rows=weeksOf(m);while(rows.length<6)rows.push(null);
    return `<div class="mini"><h3>${esc(cap(mName.format(m)))}</h3><table><tr>${S.wknum?'<th></th>':''}${wdays.map(w=>`<th>${esc(dNarrow.format(w))}</th>`).join('')}</tr>`+
    rows.map(r=>r?`<tr>${S.wknum?`<td class="wkn">${wk(r)}</td>`:''}${r.map(d=>{if(d.getMonth()!==m.getMonth())return'<td></td>';const e=ev(d);return`<td class="${we(d)?'we ':''}${e.length?'hol':''}"${e.length?` title="${esc(e.join(', '))}"`:''}>${d.getDate()}</td>`}).join('')}</tr>`:'<tr><td>&nbsp;</td></tr>').join('')+'</table></div>'};
  const notes=S.notes?'<div class="notes"></div>':'';
  const page=(inner,cls='')=>`<div class="page${land?' land':''} ${cls}">${inner}</div>`;
  let pages=[];
  if(F==='wall')pages=months.map((m,i)=>page(sheet('wall',m,photo(i,m)+`<div class="col">${hdr(m)}${grid(m)}${notes}</div>`)));
  else if(F==='month')pages=months.map(m=>page(sheet('plan',m,hdr(m)+grid(m)+notes)));
  else if(F==='flip'){const cards=months.map((m,i)=>sheet('flip',m,photo(i,m)+`<div class="col">${hdr(m)}${grid(m)}</div>`));for(let i=0;i<cards.length;i+=2)pages.push(page(cards[i]+(cards[i+1]||'<div class="sheet"></div>'),'duo'))}
  else if(F==='year'||F==='poster'){for(let p=0;p<n;p+=12){const ch=months.slice(p,p+12),y1=ch[0].getFullYear(),y2=ch.at(-1).getFullYear(),ttl=y1===y2?y1:y1+' – '+y2;
      const minis=`<div class="year" style="--yc:${land?(F==='poster'?3:4):(F==='poster'?4:3)}">${ch.map(mini).join('')}</div>`;
      pages.push(page(F==='year'?sheet('yr',ch[0],`<div class="hdr"><span class="mn">${ttl}</span></div>`+minis):sheet('poster',ch[0],photo(p/12,ch[0],`<div class="ttl">${ttl}</div>`)+`<div class="col" style="flex:1;display:flex;min-width:0">${minis}</div>`)))}}
  else if(F==='week'){const end=new Date(fy,fm-1+n,1),d=new Date(months[0]);d.setDate(1-((d.getDay()-ws+7)%7));
    while(d<end){const r=[...Array(7)].map((_,i)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+i));
      pages.push(page(sheet('week',r[3],`<div class="hdr"><span class="mn">${esc(cap(mName.format(r[3])))}</span><span class="yr">${S.wknum?`W${wk(r)} · `:''}${esc(dMon.format(r[0]))} – ${esc(dMon.format(r[6]))}</span></div><div class="rows">`+
      r.map(x=>`<div class="r${we(x)?' we':''}${x<months[0]||x>=end?' off':''}"><div class="dn"><b>${x.getDate()}</b><small>${esc(dShort.format(x))}</small></div><div class="ln">${ev(x).map(e=>`<i>${esc(e)}</i>`).join('')}</div></div>`).join('')+'</div>'+notes)));d.setDate(d.getDate()+7)}}
  else if(F==='daily'){const end=new Date(fy,fm-1+n,1),cards=[];
    for(const d=new Date(months[0]);d<end;d.setDate(d.getDate()+1)){const e=ev(d),y0=new Date(d.getFullYear(),0,1),doy=Math.round((d-y0)/864e5)+1,len=new Date(d.getFullYear(),1,29).getDate()===29?366:365;
      cards.push(`<div class="sheet ${T}${W} day${we(d)?' we':''}${e.length?' hol':''}" style="--h:${hue(d)}">${S.holes?'<div class="holes"><i></i><i></i></div>':''}<div class="in"><div class="band">${esc(cap(mName.format(d)))}<small>${d.getFullYear()}</small></div><div class="num">${d.getDate()}</div><div class="wd">${esc(cap(dLong.format(d)))}</div><div class="evs">${e.map(x=>`<b>${esc(x)}</b>`).join('')}</div><div class="ft"><span>${S.wknum?'W'+isoWeek(d):''}</span><span>${doy} / ${len}</span></div></div></div>`)}
    for(let i=0;i<cards.length;i+=4)pages.push(page(cards.slice(i,i+4).join('')+'<div class="sheet"></div>'.repeat(Math.max(0,4-cards.slice(i,i+4).length)),'four'))}
  $('out').innerHTML=pages.join('');
  $('fname').textContent=fmt()[1];$('pcount').textContent=`· ${pages.length} A4 page${pages.length>1?'s':''}${F==='flip'?' · cut along the dashes':F==='daily'?' · cut into 4 cards':''}`;
  bindPhotos();renderSlots();
}
function bindPhotos(){document.querySelectorAll('#out .ph[data-slot]').forEach(el=>{const i=+el.dataset.slot;dropOn(el,i);
  const x=el.querySelector('.phx');if(x)x.onclick=()=>pick(i);
  const img=el.querySelector('img');if(!img)return;
  img.ondblclick=()=>pick(i);
  img.onpointerdown=e=>{e.preventDefault();img.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,ox=P[i].x,oy=P[i].y,r=el.getBoundingClientRect();
    const k=img.naturalWidth/img.naturalHeight>r.width/r.height;img.style.cursor='grabbing';
    img.onpointermove=ev=>{if(k)P[i].x=Math.max(0,Math.min(100,ox-(ev.clientX-sx)/r.width*120));else P[i].y=Math.max(0,Math.min(100,oy-(ev.clientY-sy)/r.height*120));
      document.querySelectorAll(`#out .ph[data-slot="${i}"] img`).forEach(m=>m.style.objectPosition=`${P[i].x}% ${P[i].y}%`)};
    img.onpointerup=()=>{img.onpointermove=null;img.style.cursor='';savePh(i)}}})}
function renderSlots(){const n=nSlots(),[fy,fm]=S.from.split('-').map(Number);
  $('phsec').style.opacity=n?1:.55;
  $('phhint').textContent=n?`· ${S.format==='poster'?'one per poster':'one per month'}`:'· this format has no photos';
  const lbl=i=>S.format==='poster'?String(new Date(fy,fm-1+i*12,1).getFullYear()):new Intl.DateTimeFormat(S.lang,{month:'short'}).format(new Date(fy,fm-1+i,1));
  $('slots').innerHTML=[...Array(Math.max(n,1))].map((_,i)=>`<div class="slot${P[i]?' has':''}" data-slot="${i}" style="${P[i]?`background-image:url(${P[i].url})`:''}"><em>${esc(lbl(i))}</em><span class="x" title="Remove">×</span></div>`).join('');
  $('slots').querySelectorAll('.slot').forEach(el=>{const i=+el.dataset.slot;dropOn(el,i);el.onclick=e=>{if(e.target.classList.contains('x')){URL.revokeObjectURL(P[i].url);delete P[i];savePh(i);draw()}else pick(i)}});
  const cb=$('capbox');cb.classList.toggle('on',!!S.caps&&n>0);
  if(S.caps&&!cb.contains(document.activeElement))cb.innerHTML=[...Array(n)].map((_,i)=>P[i]?`<input data-cap="${i}" placeholder="${esc(lbl(i))} caption" value="${esc(P[i].cap||'')}" style="margin-bottom:5px">`:'').join('')||'<span class="hint">Add photos first.</span>';
  cb.querySelectorAll('[data-cap]').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.cap;P[i].cap=inp.value;savePh(i);draw()});
}
loadPh().catch(()=>{}).finally(draw);
document.fonts&&document.fonts.ready.then(()=>{});
</script>
